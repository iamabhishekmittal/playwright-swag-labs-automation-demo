name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # These are public Swag Labs training credentials. Use GitHub Secrets for real credentials.
      BASE_URL: https://www.saucedemo.com
      TEST_USER_USERNAME: standard_user
      TEST_USER_PASSWORD: secret_sauce
      LOCKED_USER_USERNAME: locked_out_user

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright suite
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
